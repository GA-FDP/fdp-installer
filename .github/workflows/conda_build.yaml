name: Conda Package CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'release-*'
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Set staging channel for pre-release builds
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          if [[ "$VERSION" =~ (rc|a|b)[0-9] ]]; then
            echo "EXTRA_CHANNEL=ga-fdp/label/staging" >> $GITHUB_ENV
          fi

      - name: Build Conda package
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          # ga-dfl-labeler has __glibc <2.35 constraint from its build env;
          # override so it installs on newer Ubuntu CI runners
          CONDA_OVERRIDE_GLIBC: "2.28"
          EXTRA_CHANNEL: ${{ env.EXTRA_CHANNEL }}
        run: |
          pixi global install rattler-build
          cd conda-recipe && bash run_build.sh ${HOME}/outdir

      - name: Keep the built package for the macOS end-to-end job
        uses: actions/upload-artifact@v4
        with:
          name: noarch-package
          path: ~/outdir/noarch/*.conda
          if-no-files-found: error

  test_osx:
    # The recipe test is the end-to-end one (tests/testit.py): fdp-install
    # builds a real environment from the newest blessed fdp-core, then
    # imports, fdp env/run/ls, a ptdata fetch and skills. On Apple Silicon
    # that install is native, so this is the Mac acceptance test.
    needs: build_and_test
    runs-on: macos-14
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: noarch-package
          path: pkg

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          run-install: false

      - name: End-to-end install on Apple Silicon
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: |
          pixi global install rattler-build
          for f in pkg/*.conda; do
            rattler-build test --package-file "$f" -c conda-forge
          done

  upload:
    # After both platforms passed.
    if: startsWith(github.ref, 'refs/tags/release-')
    needs: [build_and_test, test_osx]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: noarch-package
          path: outdir/noarch

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          run-install: false

      - name: Install rattler-build
        run: pixi global install rattler-build

      - name: Upload to Anaconda
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          VERSION="${GITHUB_REF#refs/tags/release-}"
          if [[ "$VERSION" =~ (rc|a|b)[0-9] ]]; then
            LABEL="staging"
          else
            LABEL="main"
          fi
          rattler-build upload anaconda \
            --owner ga-fdp \
            --channel "$LABEL" \
            --api-key ${{ secrets.ANACONDA_API_TOKEN }} \
            --force \
            outdir/noarch/*.conda
